<!DOCTYPE html>
<html lang="vi" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinFamily Cloud - Quản Lý Dòng Tiền</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
        .loader { border-top-color: #10b981; -webkit-animation: spinner 1.5s linear infinite; animation: spinner 1.5s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen flex flex-col text-slate-800">

    <!-- MÀN HÌNH ĐĂNG NHẬP / ĐĂNG KÝ -->
    <div id="authScreen" class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-slate-800 to-slate-900">
        <div class="max-w-md w-full bg-white rounded-3xl shadow-2xl overflow-hidden border border-slate-100 p-8">
            
            <div class="text-center mb-6">
                <div class="w-14 h-14 mx-auto rounded-2xl bg-emerald-500 flex items-center justify-center font-bold text-2xl text-white shadow-lg mb-4">₫</div>
                <h1 class="text-2xl font-bold text-slate-800">FinFamily Cloud</h1>
                <p class="text-sm text-slate-500 mt-1">Hệ thống đồng bộ dữ liệu đám mây</p>
                <div class="mt-3 inline-flex items-center gap-2 px-3 py-1 rounded-full bg-slate-100 border border-slate-200 text-[11px] font-medium text-slate-600">
                    <span id="connDot" class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
                    <span id="connText">Đang khởi tạo kết nối Cloud...</span>
                </div>
            </div>

            <!-- Tabs -->
            <div class="grid grid-cols-2 bg-slate-100 p-1 rounded-xl mb-6">
                <button type="button" id="tabLoginBtn" onclick="switchAuthTab('login')" class="py-2 text-sm font-semibold rounded-lg bg-white shadow text-slate-800 transition">Đăng nhập</button>
                <button type="button" id="tabRegisterBtn" onclick="switchAuthTab('register')" class="py-2 text-sm font-semibold rounded-lg text-slate-500 hover:text-slate-800 transition">Đăng ký mới</button>
            </div>

            <!-- Cảnh báo lỗi -->
            <div id="authAlert" class="hidden mb-4 p-3 rounded-xl text-xs font-bold border text-center"></div>

            <form id="authForm" class="space-y-4">
                <div id="familyNameGroup" class="hidden">
                    <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Tên Quỹ / Gia đình</label>
                    <input type="text" id="authFamilyName" placeholder="VD: Gia đình Phạm Hiếu" class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 focus:bg-white focus:border-emerald-500 focus:outline-none text-sm">
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Địa chỉ Email</label>
                    <input type="email" id="authEmail" required placeholder="email-cua-ban@gmail.com" class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 focus:bg-white focus:border-emerald-500 focus:outline-none text-sm">
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Mật khẩu</label>
                    <input type="password" id="authPassword" required minlength="6" placeholder="Tối thiểu 6 ký tự" class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 focus:bg-white focus:border-emerald-500 focus:outline-none text-sm">
                </div>

                <button type="submit" id="authSubmitBtn" class="w-full py-3.5 mt-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-sm shadow-lg shadow-emerald-600/30 transition flex items-center justify-center gap-2">
                    <span>Đăng nhập đồng bộ Cloud</span>
                </button>
            </form>
        </div>
    </div>

    <!-- MÀN HÌNH CHÍNH (DASHBOARD) -->
    <div id="appScreen" class="hidden flex-1 flex flex-col">
        <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
            <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-emerald-600 text-white flex items-center justify-center font-bold text-lg">₫</div>
                    <div>
                        <div class="flex items-center gap-2">
                            <h1 id="headerFamilyName" class="font-bold text-slate-800 text-base">Quỹ Gia Đình</h1>
                            <span class="px-2 py-0.5 text-[10px] font-bold rounded-full bg-emerald-100 text-emerald-700 uppercase flex items-center gap-1">
                                <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span> Đã kết nối Cloud
                            </span>
                        </div>
                        <p id="headerUserEmail" class="text-xs text-slate-500 font-medium">user@email.com</p>
                    </div>
                </div>
                <button onclick="handleLogout()" class="px-4 py-2 rounded-lg bg-rose-50 hover:bg-rose-100 text-rose-600 text-xs font-bold transition">Đăng xuất</button>
            </div>
        </header>

        <main class="max-w-7xl w-full mx-auto px-4 py-6 space-y-6 flex-1">
            <!-- KPIs -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm text-center">
                    <p class="text-xs font-bold uppercase text-slate-400">Tổng Thu</p>
                    <p id="kpiIncome" class="text-2xl font-black text-emerald-600 mt-1">0 ₫</p>
                </div>
                <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm text-center">
                    <p class="text-xs font-bold uppercase text-slate-400">Tổng Chi</p>
                    <p id="kpiExpense" class="text-2xl font-black text-rose-600 mt-1">0 ₫</p>
                </div>
                <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm text-center">
                    <p class="text-xs font-bold uppercase text-slate-400">Số Dư</p>
                    <p id="kpiBalance" class="text-2xl font-black text-blue-600 mt-1">0 ₫</p>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <!-- Thêm giao dịch -->
                <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                    <h3 class="font-bold text-slate-800 text-base mb-4">➕ Thêm Giao Dịch</h3>
                    <form id="txForm" class="space-y-4">
                        <div class="grid grid-cols-2 gap-2 bg-slate-100 p-1 rounded-xl">
                            <button type="button" id="btnTypeExpense" onclick="setTxType('expense')" class="py-2 rounded-lg text-xs font-bold bg-rose-600 text-white shadow transition">Khoản Chi (-)</button>
                            <button type="button" id="btnTypeIncome" onclick="setTxType('income')" class="py-2 rounded-lg text-xs font-bold text-slate-600 transition">Khoản Thu (+)</button>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 mb-1">Số tiền (VNĐ)</label>
                            <input type="number" id="txAmount" required min="1000" step="1000" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm font-bold focus:border-emerald-500 outline-none">
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-semibold text-slate-500 mb-1">Danh mục</label>
                                <select id="txCategory" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 text-xs font-medium bg-white"></select>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-500 mb-1">Thành viên</label>
                                <select id="txMember" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 text-xs font-medium bg-white">
                                    <option value="Quỹ Chung">🏠 Quỹ Chung</option>
                                    <option value="Bố">👨 Bố</option>
                                    <option value="Mẹ">👩 Mẹ</option>
                                    <option value="Con cái">🧒 Con cái</option>
                                </select>
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 mb-1">Ghi chú</label>
                            <input type="text" id="txNote" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-xs focus:border-emerald-500 outline-none">
                        </div>
                        <button type="submit" class="w-full py-3 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-bold text-sm shadow transition">
                            ☁️ Lưu lên Cloud
                        </button>
                    </form>
                </div>

                <!-- Bảng lịch sử -->
                <div class="lg:col-span-2 bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex flex-col">
                    <h3 class="font-bold text-slate-800 text-base mb-4">📋 Lịch sử đồng bộ Cloud</h3>
                    <div class="flex-1 overflow-auto max-h-[400px]">
                        <table class="w-full text-left border-collapse">
                            <thead class="sticky top-0 bg-white">
                                <tr class="border-b border-slate-200 text-[11px] uppercase text-slate-400">
                                    <th class="py-2.5 px-3">Danh mục</th>
                                    <th class="py-2.5 px-3">Ghi chú</th>
                                    <th class="py-2.5 px-3">Thành viên</th>
                                    <th class="py-2.5 px-3 text-right">Số tiền</th>
                                </tr>
                            </thead>
                            <tbody id="txTableBody" class="divide-y divide-slate-100 text-xs"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- CODE XỬ LÝ FIREBASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { 
            getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, 
            signOut, onAuthStateChanged, updateProfile 
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { 
            getFirestore, collection, addDoc, doc, onSnapshot, query, orderBy, setDoc, getDoc 
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";


const firebaseConfig = {
  apiKey: "AIzaSyCV4AetmA-0Cnu5ScPvdvdosz54Mogg9vQ",
  authDomain: "quanlidongtien-53a25.firebaseapp.com",
  projectId: "quanlidongtien-53a25",
  storageBucket: "quanlidongtien-53a25.firebasestorage.app",
  messagingSenderId: "277992506032",
  appId: "1:277992506032:web:d3992573d3d547d48b7175",
  measurementId: "G-Y649WVZHPS"
};

        let app, auth, db, currentUser = null, unsubscribeFirestore = null;
        let currentAuthMode = 'login', currentTxType = 'expense';

        const CATEGORIES = {
            expense: ['Ăn uống', 'Hóa đơn', 'Học phí', 'Mua sắm', 'Khác'],
            income: ['Lương chính', 'Thưởng', 'Kinh doanh', 'Khác']
        };

        // Khởi tạo
        try {
            app = initializeApp(YOUR_FIREBASE_CONFIG);
            auth = getAuth(app);
            db = getFirestore(app);
            
            document.getElementById('connDot').className = 'w-2 h-2 rounded-full bg-emerald-500';
            document.getElementById('connText').innerHTML = '<span class="text-emerald-600 font-bold">✓ Đã kết nối Firebase Cloud</span>';

            onAuthStateChanged(auth, async (user) => {
                if (user) {
                    let familyName = user.displayName || 'Quỹ Gia Đình';
                    try {
                        const snap = await getDoc(doc(db, 'family_profiles', user.uid));
                        if (snap.exists() && snap.data().familyName) familyName = snap.data().familyName;
                    } catch (e) {}
                    enterDashboard(user.uid, user.email, familyName);
                } else {
                    document.getElementById('appScreen').classList.add('hidden');
                    document.getElementById('authScreen').classList.remove('hidden');
                }
            });
        } catch (err) {
            document.getElementById('connDot').className = 'w-2 h-2 rounded-full bg-rose-500';
            document.getElementById('connText').innerHTML = `<span class="text-rose-600 font-bold">Lỗi khởi tạo: ${err.message}</span>`;
        }

        // Chuyển tab Đăng ký / Đăng nhập
        window.switchAuthTab = function(mode) {
            currentAuthMode = mode;
            const isReg = mode === 'register';
            document.getElementById('familyNameGroup').classList.toggle('hidden', !isReg);
            document.getElementById('authSubmitBtn').innerHTML = isReg ? '<span>Tạo tài khoản lên Cloud</span>' : '<span>Đăng nhập đồng bộ Cloud</span>';

            document.getElementById('tabLoginBtn').className = !isReg ? 'py-2 text-sm font-semibold rounded-lg bg-white shadow text-slate-800' : 'py-2 text-sm font-semibold rounded-lg text-slate-500 hover:text-slate-800';
            document.getElementById('tabRegisterBtn').className = isReg ? 'py-2 text-sm font-semibold rounded-lg bg-white shadow text-slate-800' : 'py-2 text-sm font-semibold rounded-lg text-slate-500 hover:text-slate-800';
            hideAlert();
        };

        function showAlert(msg, isError = true) {
            const box = document.getElementById('authAlert');
            box.textContent = msg;
            box.className = `mb-4 p-3 rounded-xl text-xs font-bold border text-center ${isError ? 'bg-rose-50 text-rose-600 border-rose-200' : 'bg-emerald-50 text-emerald-700 border-emerald-200'}`;
            box.classList.remove('hidden');
        }
        function hideAlert() { document.getElementById('authAlert').classList.add('hidden'); }

        // Form Submit Xác thực
        document.getElementById('authForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            hideAlert();
            const email = document.getElementById('authEmail').value.trim();
            const password = document.getElementById('authPassword').value;
            const btn = document.getElementById('authSubmitBtn');
            
            btn.disabled = true;
            btn.innerHTML = `<div class="w-4 h-4 border-2 border-white rounded-full loader border-r-transparent"></div> Đang xử lý...`;

            try {
                if (currentAuthMode === 'register') {
                    const famName = document.getElementById('authFamilyName').value.trim() || 'Quỹ Gia Đình';
                    const cred = await createUserWithEmailAndPassword(auth, email, password);
                    try { await updateProfile(cred.user, { displayName: famName }); } catch(e){}
                    try { await setDoc(doc(db, 'family_profiles', cred.user.uid), { familyName: famName, email, createdAt: new Date().toISOString() }); } catch(e){}
                    showAlert('Tạo tài khoản Cloud thành công!', false);
                } else {
                    await signInWithEmailAndPassword(auth, email, password);
                }
            } catch (err) {
                console.error(err);
                if (err.code === 'auth/email-already-in-use') showAlert('❌ Email này đã tồn tại! Vui lòng Đăng nhập.');
                else if (err.code === 'auth/invalid-credential' || err.code === 'auth/wrong-password') showAlert('❌ Sai email hoặc mật khẩu!');
                else showAlert(`❌ Lỗi Firebase: ${err.message}`);
            } finally {
                btn.disabled = false;
                btn.innerHTML = currentAuthMode === 'register' ? '<span>Tạo tài khoản lên Cloud</span>' : '<span>Đăng nhập đồng bộ Cloud</span>';
            }
        });

        // Vào Dashboard
        function enterDashboard(uid, email, familyName) {
            currentUser = { uid, email, familyName };
            document.getElementById('authScreen').classList.add('hidden');
            document.getElementById('appScreen').classList.remove('hidden');
            document.getElementById('headerFamilyName').textContent = familyName;
            document.getElementById('headerUserEmail').textContent = email;

            if (unsubscribeFirestore) unsubscribeFirestore();
            try {
                const q = query(collection(db, 'families', uid, 'transactions'), orderBy('createdAt', 'desc'));
                unsubscribeFirestore = onSnapshot(q, (snapshot) => {
                    const txs = [];
                    snapshot.forEach(d => txs.push({ id: d.id, ...d.data() }));
                    renderTable(txs);
                }, (error) => {
                    document.getElementById('txTableBody').innerHTML = `<tr><td colspan="4" class="py-6 text-center text-rose-500 font-bold">❌ Bị chặn đọc dữ liệu. Hãy mở quyền Cloud Firestore Rules!</td></tr>`;
                });
            } catch (error) {}
        }

        window.handleLogout = async function() {
            if (unsubscribeFirestore) unsubscribeFirestore();
            await signOut(auth);
        };

        window.setTxType = function(type) {
            currentTxType = type;
            document.getElementById('btnTypeExpense').className = type === 'expense' ? 'py-2 rounded-lg text-xs font-bold bg-rose-600 text-white shadow' : 'py-2 rounded-lg text-xs font-bold text-slate-600';
            document.getElementById('btnTypeIncome').className = type === 'income' ? 'py-2 rounded-lg text-xs font-bold bg-emerald-600 text-white shadow' : 'py-2 rounded-lg text-xs font-bold text-slate-600';
            document.getElementById('txCategory').innerHTML = CATEGORIES[type].map(c => `<option value="${c}">${c}</option>`).join('');
        };
        setTxType('expense');

        document.getElementById('txForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!currentUser) return;
            const btn = e.target.querySelector('button[type="submit"]');
            btn.disabled = true;
            btn.textContent = "Đang đẩy lên Cloud...";

            const newTx = {
                type: currentTxType,
                amount: Number(document.getElementById('txAmount').value),
                category: document.getElementById('txCategory').value,
                member: document.getElementById('txMember').value,
                note: document.getElementById('txNote').value,
                createdAt: new Date().toISOString()
            };

            try {
                await addDoc(collection(db, 'families', currentUser.uid, 'transactions'), newTx);
                document.getElementById('txAmount').value = '';
                document.getElementById('txNote').value = '';
            } catch (err) {
                alert("❌ Lỗi: Bị chặn quyền Ghi! Hãy cập nhật Firestore Rules thành allow read, write: if request.auth != null;");
            } finally {
                btn.disabled = false;
                btn.textContent = "☁️ Lưu lên Cloud";
            }
        });

        function formatVND(n) { return new Intl.NumberFormat('vi-VN').format(n || 0) + ' ₫'; }

        function renderTable(data) {
            const tbody = document.getElementById('txTableBody');
            let inc = 0, exp = 0;
            data.forEach(t => t.type === 'income' ? inc += t.amount : exp += t.amount);
            
            document.getElementById('kpiIncome').textContent = formatVND(inc);
            document.getElementById('kpiExpense').textContent = formatVND(exp);
            document.getElementById('kpiBalance').textContent = formatVND(inc - exp);

            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="py-8 text-center text-slate-400 font-medium">Chưa có giao dịch. Hãy nhập dữ liệu bên trái!</td></tr>`;
                return;
            }
            tbody.innerHTML = data.map(t => `
                <tr class="hover:bg-slate-50 transition border-b border-slate-50">
                    <td class="py-3 px-3 font-bold text-slate-800">${t.category}</td>
                    <td class="py-3 px-3 text-slate-600 font-medium">${t.note}</td>
                    <td class="py-3 px-3"><span class="px-2 py-1 rounded-md bg-slate-100 text-slate-700 font-bold text-[10px] uppercase">${t.member}</span></td>
                    <td class="py-3 px-3 text-right font-black text-sm ${t.type === 'income' ? 'text-emerald-600' : 'text-rose-600'}">
                        ${t.type === 'income' ? '+' : '-'}${formatVND(t.amount)}
                    </td>
                </tr>
            `).join('');
        }
    </script>
</body>
</html>
